<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="50%" stop-color="#14112e"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bankBg)"/>

  <!-- Figma Frame Wireframe Presentation -->
  <g transform="translate(60, 40)">
    <!-- Header -->
    <text x="0" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Mobile Fintech Workflow &amp; Prototyping</text>
    <text x="0" y="44" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Wireframing, interactive prototyping, and frictionless checkout flows</text>

    <!-- 3 Mobile Screens Wireframes in Row -->
    <g transform="translate(40, 65)">
      <!-- Screen 1: Dashboard -->
      <g transform="translate(0, 0)">
        <rect width="180" height="330" rx="20" fill="#0d1126" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
        <rect x="50" y="10" width="80" height="12" rx="6" fill="#182042"/>
        <text x="20" y="50" fill="#94a3b8" font-size="10">Total Balance</text>
        <text x="20" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18">₹1,24,500</text>
        <rect x="20" y="95" width="140" height="60" rx="10" fill="#182042"/>
        <text x="32" y="120" fill="#ffffff" font-size="10" font-weight="600">Quick Transfer</text>
        <circle cx="45" cy="138" r="8" fill="#38bdf8"/>
        <circle cx="75" cy="138" r="8" fill="#818cf8"/>
        <circle cx="105" cy="138" r="8" fill="#c084fc"/>
        <text x="20" y="180" fill="#94a3b8" font-size="9">Recent Transactions</text>
        <rect x="20" y="195" width="140" height="30" rx="6" fill="#131936"/>
        <rect x="20" y="235" width="140" height="30" rx="6" fill="#131936"/>
        <rect x="20" y="275" width="140" height="30" rx="6" fill="#131936"/>
      </g>

      <!-- Screen 2: Payment Confirmation Flow (Connecting Arrow) -->
      <path d="M 195 160 L 225 160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <g transform="translate(240, 0)">
        <rect width="180" height="330" rx="20" fill="#0d1126" stroke="#8b5cf6" stroke-width="1.5"/>
        <rect x="50" y="10" width="80" height="12" rx="6" fill="#182042"/>
        <circle cx="90" cy="70" r="24" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
        <text x="90" y="76" fill="#10b981" font-size="18" text-anchor="middle">✓</text>
        <text x="90" y="115" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">Payment Success</text>
        <text x="90" y="132" fill="#94a3b8" font-size="9" text-anchor="middle">Transaction ID #482910</text>
        <rect x="20" y="155" width="140" height="85" rx="10" fill="#141938"/>
        <text x="32" y="178" fill="#64748b" font-size="8">Recipient</text>
        <text x="32" y="192" fill="#e2e8f0" font-size="10" font-weight="600">Enterprise Vendor</text>
        <text x="32" y="214" fill="#64748b" font-size="8">Amount</text>
        <text x="32" y="228" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">₹8,450.00</text>
        <rect x="20" y="260" width="140" height="36" rx="8" fill="#8b5cf6"/>
        <text x="90" y="282" fill="#ffffff" font-weight="600" font-size="10" text-anchor="middle">Download Receipt</text>
      </g>

      <!-- Screen 3: User Profile & Security Settings -->
      <g transform="translate(480, 0)">
        <rect width="180" height="330" rx="20" fill="#0d1126" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
        <rect x="50" y="10" width="80" height="12" rx="6" fill="#182042"/>
        <circle cx="90" cy="65" r="22" fill="#1e264f"/>
        <text x="90" y="70" fill="#c084fc" font-size="12" text-anchor="middle" font-weight="700">PD</text>
        <text x="90" y="102" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Prince Dhamsaniya</text>
        <text x="90" y="116" fill="#64748b" font-size="8" text-anchor="middle">Biometric Auth Enabled</text>
        <rect x="20" y="135" width="140" height="34" rx="8" fill="#141938"/>
        <text x="30" y="156" fill="#cbd5e1" font-size="9">Two-Factor Authentication</text>
        <rect x="20" y="180" width="140" height="34" rx="8" fill="#141938"/>
        <text x="30" y="201" fill="#cbd5e1" font-size="9">Card Management</text>
        <rect x="20" y="225" width="140" height="34" rx="8" fill="#141938"/>
        <text x="30" y="246" fill="#cbd5e1" font-size="9">Notification Settings</text>
      </g>
    </g>
  </g>
</svg>
