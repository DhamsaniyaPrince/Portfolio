<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="uiuxBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1026"/>
      <stop offset="50%" stop-color="#181335"/>
      <stop offset="100%" stop-color="#0a0b18"/>
    </linearGradient>
    <pattern id="uiuxGrid1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(168, 85, 247, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#uiuxBg1)"/>
  <rect width="800" height="500" fill="url(#uiuxGrid1)"/>

  <!-- Figma Canvas Chrome -->
  <g transform="translate(50, 40)">
    <rect width="700" height="420" rx="16" fill="#11132b" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

    <!-- Figma Style Topbar -->
    <rect width="700" height="40" rx="16" fill="#171838"/>
    <rect y="26" width="700" height="14" fill="#171838"/>
    <line x1="0" y1="40" x2="700" y2="40" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <!-- Figma logo icon & Title -->
    <circle cx="25" cy="20" r="6" fill="#a855f7"/>
    <text x="40" y="24" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11">Dark Theme Design System &amp; Component Kit</text>
    <rect x="580" y="10" width="90" height="20" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)"/>
    <text x="625" y="23" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Figma Draft</text>

    <!-- Canvas Workspace -->
    <g transform="translate(30, 60)">
      <!-- Component Palette Card 1: Colors & Typography -->
      <g transform="translate(0, 0)">
        <rect width="200" height="320" rx="12" fill="#151736" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="16" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Color Tokens &amp; Contrast</text>
        
        <!-- Swatches -->
        <rect x="16" y="44" width="38" height="38" rx="8" fill="#06b6d4"/>
        <rect x="60" y="44" width="38" height="38" rx="8" fill="#10b981"/>
        <rect x="104" y="44" width="38" height="38" rx="8" fill="#8b5cf6"/>
        <rect x="148" y="44" width="38" height="38" rx="8" fill="#f43f5e"/>

        <text x="16" y="106" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">WCAG AA Compliant</text>

        <!-- Typography Samples -->
        <line x1="16" y1="120" x2="184" y2="120" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="16" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18">Display Aa</text>
        <text x="16" y="170" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14">Heading 600</text>
        <text x="16" y="195" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="11">Body text reading balance</text>
        <text x="16" y="215" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">monospace tags &amp; code</text>

        <!-- Elevation pills -->
        <rect x="16" y="245" width="168" height="26" rx="6" fill="#1e2148"/>
        <text x="24" y="261" fill="#c084fc" font-size="9" font-family="'JetBrains Mono', monospace">Elevation: 0 4px 20px blur</text>
      </g>

      <!-- Component Palette Card 2: Interactive Controls -->
      <g transform="translate(220, 0)">
        <rect width="200" height="320" rx="12" fill="#151736" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="16" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Interactive Controls</text>

        <!-- Primary Button Variant -->
        <rect x="16" y="48" width="168" height="36" rx="10" fill="url(#uiuxBg1)" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="100" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" text-anchor="middle">Primary Accent CTA</text>

        <!-- Secondary Button Variant -->
        <rect x="16" y="96" width="168" height="36" rx="10" fill="#1e2148" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="100" y="118" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" text-anchor="middle">Secondary Neutral</text>

        <!-- Input Field -->
        <rect x="16" y="148" width="168" height="36" rx="8" fill="#0d0f22" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="26" y="170" fill="#64748b" font-size="10">Placeholder prompt...</text>

        <!-- Segmented Tabs -->
        <rect x="16" y="200" width="168" height="32" rx="8" fill="#0d0f22"/>
        <rect x="18" y="202" width="54" height="28" rx="6" fill="#8b5cf6"/>
        <text x="45" y="219" fill="#ffffff" font-size="9" text-anchor="middle">Tab 1</text>
        <text x="100" y="219" fill="#64748b" font-size="9" text-anchor="middle">Tab 2</text>
        <text x="150" y="219" fill="#64748b" font-size="9" text-anchor="middle">Tab 3</text>

        <!-- Toggle Switch -->
        <g transform="translate(16, 250)">
          <rect width="40" height="20" rx="10" fill="#8b5cf6"/>
          <circle cx="30" cy="10" r="8" fill="#ffffff"/>
          <text x="50" y="14" fill="#cbd5e1" font-size="10">Active State</text>
        </g>
      </g>

      <!-- Component Palette Card 3: Layout System & Responsive Grid -->
      <g transform="translate(440, 0)">
        <rect width="200" height="320" rx="12" fill="#151736" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="16" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Spatial Grid &amp; Layout</text>

        <!-- Column guides -->
        <g transform="translate(16, 48)">
          <rect width="36" height="150" rx="4" fill="rgba(168, 85, 247, 0.12)"/>
          <rect x="44" width="36" height="150" rx="4" fill="rgba(168, 85, 247, 0.12)"/>
          <rect x="88" width="36" height="150" rx="4" fill="rgba(168, 85, 247, 0.12)"/>
          <rect x="132" width="36" height="150" rx="4" fill="rgba(168, 85, 247, 0.12)"/>
        </g>

        <!-- 8pt Baseline grid note -->
        <text x="16" y="225" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">8-Point Spacing Grid</text>
        <text x="16" y="245" fill="#94a3b8" font-size="10">4px · 8px · 16px · 24px · 32px</text>
        <text x="16" y="265" fill="#64748b" font-size="9">Auto-layout tokens synced</text>
      </g>
    </g>
  </g>
</svg>
