<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad1)"/>
  <rect width="800" height="480" fill="url(#gridPattern1)"/>

  <!-- Ambient Glow -->
  <circle cx="400" cy="200" r="180" fill="#06b6d4" opacity="0.08" filter="blur(60px)"/>

  <!-- Mockup Window Frame -->
  <g transform="translate(60, 50)">
    <!-- Window Border & Background -->
    <rect width="680" height="370" rx="14" fill="#0b1124" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <rect width="680" height="44" rx="14" fill="#0f172e"/>
    <!-- Overwrite bottom corner radius of topbar -->
    <rect y="30" width="680" height="14" fill="#0f172e"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.75"/>
    <circle cx="46" cy="22" r="5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="64" cy="22" r="5" fill="#10b981" opacity="0.75"/>

    <!-- Browser Address Bar -->
    <rect x="100" y="12" width="480" height="20" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="340" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">cms.princedhamsaniya.dev/dashboard</text>

    <!-- Sidebar & Main Content Split -->
    <line x1="160" y1="44" x2="160" y2="370" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

    <!-- Sidebar Items -->
    <rect x="20" y="65" width="120" height="26" rx="6" fill="rgba(6, 182, 212, 0.15)"/>
    <rect x="30" y="74" width="8" height="8" rx="2" fill="#06b6d4"/>
    <rect x="46" y="75" width="60" height="6" rx="3" fill="#38bdf8"/>

    <rect x="20" y="105" width="120" height="20" rx="6" fill="transparent"/>
    <circle cx="34" cy="115" r="4" fill="#475569"/>
    <rect x="46" y="112" width="70" height="6" rx="3" fill="#334155"/>

    <rect x="20" y="135" width="120" height="20" rx="6" fill="transparent"/>
    <circle cx="34" cy="145" r="4" fill="#475569"/>
    <rect x="46" y="142" width="55" height="6" rx="3" fill="#334155"/>

    <rect x="20" y="165" width="120" height="20" rx="6" fill="transparent"/>
    <circle cx="34" cy="175" r="4" fill="#475569"/>
    <rect x="46" y="172" width="65" height="6" rx="3" fill="#334155"/>

    <!-- Main Dashboard Area -->
    <g transform="translate(180, 65)">
      <!-- Dashboard Header -->
      <text x="0" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">Construction Project Control</text>
      <text x="0" y="38" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Role-Based Access: Admin · Contractor · Engineer · Site Manager</text>

      <!-- Stat Cards -->
      <g transform="translate(0, 52)">
        <rect width="145" height="70" rx="8" fill="#131d36" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="14" y="24" fill="#94a3b8" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Active Projects</text>
        <text x="14" y="50" fill="#38bdf8" font-size="20" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">14</text>

        <rect x="160" width="145" height="70" rx="8" fill="#131d36" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="174" y="24" fill="#94a3b8" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Equipment On-Site</text>
        <text x="174" y="50" fill="#10b981" font-size="20" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">86%</text>

        <rect x="320" width="145" height="70" rx="8" fill="#131d36" stroke="rgba(255, 255, 255, 0.06)"/>
        <text x="334" y="24" fill="#94a3b8" font-size="10" font-family="'Plus Jakarta Sans', sans-serif">Daily Reports</text>
        <text x="334" y="50" fill="#a855f7" font-size="20" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">28 Submitted</text>
      </g>

      <!-- Table / Reports Grid Mockup -->
      <g transform="translate(0, 140)">
        <rect width="465" height="135" rx="8" fill="#131d36" stroke="rgba(255, 255, 255, 0.06)"/>
        <line x1="0" y1="32" x2="465" y2="32" stroke="rgba(255, 255, 255, 0.06)"/>
        <rect x="16" y="14" width="70" height="6" rx="3" fill="#64748b"/>
        <rect x="140" y="14" width="60" height="6" rx="3" fill="#64748b"/>
        <rect x="250" y="14" width="50" height="6" rx="3" fill="#64748b"/>
        <rect x="360" y="14" width="40" height="6" rx="3" fill="#64748b"/>

        <!-- Row 1 -->
        <rect x="16" y="48" width="90" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="140" y="48" width="50" height="8" rx="4" fill="#38bdf8"/>
        <rect x="250" y="48" width="40" height="8" rx="4" fill="#10b981"/>
        <rect x="360" y="48" width="60" height="8" rx="4" fill="#94a3b8"/>

        <!-- Row 2 -->
        <rect x="16" y="74" width="80" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="140" y="74" width="65" height="8" rx="4" fill="#a855f7"/>
        <rect x="250" y="74" width="45" height="8" rx="4" fill="#f59e0b"/>
        <rect x="360" y="74" width="50" height="8" rx="4" fill="#94a3b8"/>

        <!-- Row 3 -->
        <rect x="16" y="100" width="100" height="8" rx="4" fill="#e2e8f0"/>
        <rect x="140" y="100" width="55" height="8" rx="4" fill="#38bdf8"/>
        <rect x="250" y="100" width="35" height="8" rx="4" fill="#10b981"/>
        <rect x="360" y="100" width="70" height="8" rx="4" fill="#94a3b8"/>
      </g>
    </g>
  </g>
</svg>
