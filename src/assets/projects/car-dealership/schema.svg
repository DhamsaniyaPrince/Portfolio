<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSchema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <pattern id="gridPatternSchema" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#bgGradSchema)"/>
  <rect width="800" height="480" fill="url(#gridPatternSchema)"/>
  <g transform="translate(60, 50)">
    <rect width="680" height="370" rx="14" fill="#0b1224" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <rect width="680" height="44" rx="14" fill="#101934"/>
    <rect y="30" width="680" height="14" fill="#101934"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.75"/>
    <circle cx="46" cy="22" r="5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="64" cy="22" r="5" fill="#10b981" opacity="0.75"/>
    <rect x="100" y="12" width="480" height="20" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="340" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">dealership.prisma/schema.prisma</text>
    <g transform="translate(35, 65)">
      <text x="0" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17">Prisma Schema &amp; Relational Contracts</text>
      <text x="0" y="44" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Strongly typed TypeScript models &amp; SQLite relations</text>
      <g transform="translate(0, 58)">
        <!-- Code editor card -->
        <rect width="610" height="185" rx="8" fill="#0a0f1d" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="25" y="32" fill="#a855f7" font-size="12" font-family="'JetBrains Mono', monospace">model</text>
        <text x="75" y="32" fill="#38bdf8" font-size="12" font-family="'JetBrains Mono', monospace">Vehicle</text>
        <text x="135" y="32" fill="#ffffff" font-size="12" font-family="'JetBrains Mono', monospace">{</text>

        <text x="45" y="55" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">id           String   @id @default(uuid())</text>
        <text x="45" y="75" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">vin          String   @unique</text>
        <text x="45" y="95" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">make         String</text>
        <text x="45" y="115" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">model        String</text>
        <text x="45" y="135" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">price        Decimal</text>
        <text x="45" y="155" fill="#e2e8f0" font-size="11" font-family="'JetBrains Mono', monospace">status       VehicleStatus @default(AVAILABLE)</text>

        <text x="25" y="175" fill="#ffffff" font-size="12" font-family="'JetBrains Mono', monospace">}</text>

        <g transform="translate(360, 25)">
          <rect width="220" height="135" rx="6" fill="#131d36" stroke="rgba(255, 255, 255, 0.06)"/>
          <text x="16" y="24" fill="#38bdf8" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600">TypeScript API Contract</text>
          <text x="16" y="48" fill="#94a3b8" font-size="10" font-family="'JetBrains Mono', monospace">// Auto-generated types</text>
          <text x="16" y="68" fill="#10b981" font-size="10" font-family="'JetBrains Mono', monospace">export type VehicleDTO</text>
          <text x="16" y="88" fill="#f59e0b" font-size="10" font-family="'JetBrains Mono', monospace">export type FilterQuery</text>
          <text x="16" y="112" fill="#64748b" font-size="10" font-family="'JetBrains Mono', monospace">Zero runtime type mismatch</text>
        </g>
      </g>
    </g>
  </g>
</svg>
