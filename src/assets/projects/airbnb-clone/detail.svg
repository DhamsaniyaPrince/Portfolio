      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <pattern id="gridPatternDetail" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#bgGradDetail)"/>
  <rect width="800" height="480" fill="url(#gridPatternDetail)"/>
  <g transform="translate(60, 50)">
