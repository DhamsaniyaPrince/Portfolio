<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="cricketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="gridPattern2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad2)"/>
  <rect width="800" height="480" fill="url(#gridPattern2)"/>

  <!-- Ambient Glow -->
  <circle cx="420" cy="220" r="180" fill="#10b981" opacity="0.07" filter="blur(60px)"/>

  <!-- Window Frame -->
  <g transform="translate(60, 50)">
    <rect width="680" height="370" rx="14" fill="#0c1326" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    <rect width="680" height="44" rx="14" fill="#101932"/>
    <rect y="30" width="680" height="14" fill="#101932"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="28" cy="22" r="5" fill="#ef4444" opacity="0.75"/>
    <circle cx="46" cy="22" r="5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="64" cy="22" r="5" fill="#10b981" opacity="0.75"/>

    <rect x="100" y="12" width="480" height="20" rx="6" fill="#1e293b" opacity="0.6"/>
    <text x="340" y="26" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">cricverse.live/match/realtime</text>

    <!-- Content Area -->
    <g transform="translate(35, 65)">
      <!-- Header with live pill -->
      <text x="0" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="17">CricVerse Interactive Center</text>
      <rect x="250" y="7" width="68" height="20" rx="10" fill="rgba(239, 68, 68, 0.18)" stroke="rgba(239, 68, 68, 0.3)"/>
      <circle cx="262" cy="17" r="3.5" fill="#ef4444"/>
      <text x="272" y="21" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">LIVE</text>

      <text x="0" y="44" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Real-time WebSocket scoreboards &amp; predictive analytics</text>

      <!-- Live Match Scoreboard Card -->
      <g transform="translate(0, 58)">
        <rect width="610" height="100" rx="10" fill="#141d38" stroke="rgba(255, 255, 255, 0.08)"/>

        <!-- Team 1 -->
        <g transform="translate(30, 25)">
          <text x="0" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18">IND</text>
          <text x="0" y="45" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22">184/3</text>
          <text x="0" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">(18.2 OV)</text>
        </g>

        <!-- VS Circle -->
        <circle cx="305" cy="50" r="18" fill="#1e294b" stroke="rgba(255, 255, 255, 0.1)"/>
        <text x="305" y="54" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" text-anchor="middle">VS</text>

        <!-- Team 2 -->
        <g transform="translate(480, 25)">
          <text x="70" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" text-anchor="end">AUS</text>
          <text x="70" y="45" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="22" text-anchor="end">178/7</text>
          <text x="70" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">(20.0 OV)</text>
        </g>
      </g>

      <!-- Recharts Analytics Chart Mockup -->
      <g transform="translate(0, 172)">
        <rect width="610" height="110" rx="10" fill="#141d38" stroke="rgba(255, 255, 255, 0.08)"/>
        <text x="20" y="24" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Run Rate Comparison (Over-by-Over)</text>
        
        <!-- Recharts Line Chart Simulation -->
        <polyline points="30,85 90,80 150,75 210,65 270,55 330,60 390,45 450,40 510,35 570,30" 
                  fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
        <polyline points="30,90 90,85 150,78 210,74 270,72 330,68 390,62 450,58 510,55 570,50" 
                  fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,4"/>

        <!-- Dots on active line -->
        <circle cx="390" cy="45" r="4" fill="#38bdf8" stroke="#0c1326" stroke-width="2"/>
        <circle cx="570" cy="30" r="4" fill="#38bdf8" stroke="#0c1326" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>
