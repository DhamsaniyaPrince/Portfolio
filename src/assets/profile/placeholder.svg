<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Subtle Cyan Accent Glow -->
    <radialGradient id="portraitGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="750" fill="url(#studioBg)"/>
  <rect width="600" height="750" fill="url(#archGrid)"/>
  <rect width="600" height="750" fill="url(#portraitGlow)"/>

  <!-- Viewfinder & Editorial Frame Corners -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-linecap="square" opacity="0.65">
    <!-- Top-Left Corner -->
    <path d="M 36 60 L 36 36 L 60 36"/>
    <!-- Top-Right Corner -->
    <path d="M 540 36 L 564 36 L 564 60"/>
    <!-- Bottom-Left Corner -->
    <path d="M 36 690 L 36 714 L 60 714"/>
    <!-- Bottom-Right Corner -->
    <path d="M 540 714 L 564 714 L 564 690"/>
    <!-- Crosshairs -->
    <line x1="300" y1="28" x2="300" y2="40" stroke="rgba(255,255,255,0.2)"/>
    <line x1="300" y1="710" x2="300" y2="722" stroke="rgba(255,255,255,0.2)"/>
    <line x1="28" y1="375" x2="40" y2="375" stroke="rgba(255,255,255,0.2)"/>
    <line x1="560" y1="375" x2="572" y2="375" stroke="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Central Silhouette & Identity Element -->
  <g transform="translate(0, 30)">
    <!-- Subtle Silhouette Head & Shoulders Outline -->
    <g opacity="0.4" stroke="#64748b" stroke-width="1.5" fill="none">
      <!-- Head Contour -->
      <circle cx="300" cy="270" r="90" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
      <!-- Shoulders Contour -->
      <path d="M 170 470 C 170 380, 230 365, 300 365 C 370 365, 430 380, 430 470" stroke="rgba(56, 189, 248, 0.25)"/>
    </g>

    <!-- Center Monogram Emblem -->
    <g transform="translate(300, 270)">
      <circle cx="0" cy="0" r="48" fill="#0b1329" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
      <text x="0" y="11" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" text-anchor="middle" letter-spacing="2">PD</text>
    </g>

    <!-- Typography & Information Block -->
    <g transform="translate(300, 480)" text-anchor="middle">
      <text y="0" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" letter-spacing="1">PRINCE DHAMSANIYA</text>
      <text y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="500" font-size="11" letter-spacing="1.5">FULL-STACK DEVELOPER</text>
      
      <!-- Placeholder Instructions Pill -->
      <g transform="translate(0, 45)">
        <rect x="-155" y="0" width="310" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="rgba(255, 255, 255, 0.1)"/>
        <text y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">src/assets/profile/profile-photo.png</text>
      </g>
    </g>
  </g>

  <!-- Bottom Technical Strip -->
  <g transform="translate(50, 685)" opacity="0.6">
    <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">PORTRAIT FRAME // 4:5 ASPECT RATIO</text>
    <text x="500" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">STATUS: READY</text>
  </g>
</svg>
